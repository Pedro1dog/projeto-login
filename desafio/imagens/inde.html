<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio</title>
    <link rel="stylesheet" href="estilos/style.css">
</head>
<body>
    <main>
        <section id="Login">
            <div id="form">
                <h1>Login</h1>
                <p>Seja bem-vindo(a) novamente. Faça login para acessar sua conta e poder fazer as configurações no seu ambiente.</p>
                <form action="form.php" method="post">
                    <p>
                        <label for="inome"></label>
                        <input type="text" name="nome" id="inome" required placeholder="Seu e-mail" autocomplete="username">
                    </p>
                    <p>
                        <label for="isenha"></label>
                        <input type="password" name="senha" id="isenha" required placeholder="Sua senha" autocomplete="current-password">
                    </p>

                    <input type="submit" value="Entrar" id="enter"><br>
                    <input type="reset" value="Esqueci a senha" id="password">
                </form>
            </div>
            <div id="imagem"><img src="./metal.jpg"></div>
        </section>
    </main>
</body>
</html>
